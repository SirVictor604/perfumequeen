<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;0,700;1,500&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--milk:#F6F0E4;--milk2:#EDE3D1;--ink:#241615;--red:#A3161C;--red2:#7B0F14;--line:#D9CDB8;--serif:'Bodoni Moda',Georgia,serif;--sans:'Hanken Grotesk',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{overflow-x:hidden;-webkit-text-size-adjust:100%;background:var(--milk);color:var(--ink);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.bar{pointer-events:none;user-select:none;-webkit-user-select:none;background:var(--red);color:var(--milk);overflow:hidden;white-space:nowrap;padding:9px 0;font-size:14px}
.bar-in{display:inline-flex;will-change:transform;animation:run 38s linear infinite}
.bar span{padding-right:4rem}
@keyframes run{to{transform:translateX(-50%)}}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 5vw;border-bottom:1px solid var(--line)}
.logo{--a:var(--red);--b:#E3565B;font:700 1.5rem var(--serif);letter-spacing:.01em;background:linear-gradient(100deg,var(--a) 38%,var(--b) 50%,var(--a) 62%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:sheen 6s linear infinite}
@keyframes sheen{to{background-position:-250% 0}}
header a.wa{font-size:14px;font-weight:600;text-decoration:none;border:1px solid var(--ink);padding:8px 16px;color:var(--ink)}
header a.wa:hover{background:var(--ink);color:var(--milk)}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:4vw;align-items:center;padding:7vh 5vw 6vh;max-width:1300px;margin:auto}
.hero h1{font:700 clamp(3.2rem,9vw,8rem)/.92 var(--serif);color:var(--red);letter-spacing:-.02em}
.hero p.tag{font:italic 500 clamp(1.2rem,2.4vw,1.8rem)/1.3 var(--serif);margin:1.4rem 0 2rem;max-width:30ch}
.btn{position:relative;overflow:hidden;z-index:0;display:inline-block;background:var(--red);color:var(--milk);border:0;padding:16px 34px;font-weight:600;text-decoration:none;font-size:16px;transition:color .3s}
.btn::before{content:"";position:absolute;inset:0;background:var(--red2);transform:translateY(101%);transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:-1}
.btn:disabled{opacity:.7;cursor:wait}
.btn.line{background:none;color:var(--ink);border:1px solid var(--ink)}
.btn.line::before{background:var(--ink)}
footer .btn.line::before{background:var(--red)}
.stage{position:relative;background:var(--red);aspect-ratio:1/1.1;overflow:hidden;cursor:pointer;border:0;width:100%;padding:0;display:block;text-align:left;color:var(--milk)}
.stage::after{content:"";position:absolute;inset:3.5%;border:1px solid rgba(246,240,228,.45);pointer-events:none;z-index:5}
.sl{position:absolute;inset:7%;overflow:hidden;opacity:0;transform:scale(1.07);transition:opacity .9s ease,transform .9s ease}
.sl.on{opacity:1;transform:none;z-index:2;transition:opacity .9s ease,transform 1.2s cubic-bezier(.2,.8,.2,1)}
.sl img{width:100%;height:100%;object-fit:cover}
.sl.on img{animation:kb 9s linear forwards}
@keyframes kb{to{transform:scale(1.09)}}
.cap{position:absolute;left:7%;right:7%;bottom:7%;z-index:4;padding:56px 18px 18px;background:linear-gradient(transparent,rgba(36,22,21,.75))}
.cap b{display:block;font:500 1.35rem var(--serif)}
.cap span{font-size:14px}
.cap div{transition:opacity .35s,transform .35s}
.cap.sw div{opacity:0;transform:translateY(8px)}
.pg{position:absolute;left:7%;right:7%;bottom:7%;height:3px;background:rgba(246,240,228,.3);z-index:6}
.pg i{display:block;height:100%;background:var(--milk);width:0}
.pg i.run{animation:fill var(--d,4s) linear forwards}
@keyframes fill{to{width:100%}}
.perks{display:grid;grid-template-columns:repeat(3,1fr);border-block:1px solid var(--line);max-width:1300px;margin:0 auto}
.perks div{padding:18px 5vw;font-weight:500;font-size:15px;text-align:center}
.perks div+div{border-left:1px solid var(--line)}
.shop{padding:9vh 5vw;max-width:1300px;margin:auto}
.shop h2{font:700 clamp(2rem,4vw,3rem)/1.1 var(--serif)}
.shop .sub{margin:.6rem 0 2.6rem;opacity:.75}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:36px 24px}
.card{background:none;border:0;text-align:left;padding:0}
.pic{position:relative;aspect-ratio:1/1.15;background:var(--milk2);overflow:hidden}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .45s}
.pic img+img{opacity:0}
@media(hover:hover){.card:hover .pic img+img{opacity:1}.card:hover .pic img{transform:scale(1.05)}.btn:hover::before{transform:none}.btn.line:hover{color:var(--milk)}body.run .l:hover{transform:translateY(-.06em);color:var(--red2)}}
.btn:active::before{transform:none}.btn.line:active{color:var(--milk)}
.badge{position:absolute;top:12px;left:12px;background:var(--red);color:var(--milk);font-size:12px;font-weight:600;padding:3px 10px;z-index:2}
.badge.sold{background:var(--ink)}
.card h3{font:500 1.15rem var(--serif);margin-top:14px}
.card .m{display:flex;justify-content:space-between;font-size:14px;margin-top:2px}
.card .m b{color:var(--red);font-weight:600;font-size:16px}
.empty{padding:40px;border:1px dashed var(--line);text-align:center}
footer{background:var(--ink);color:var(--milk);padding:7vh 5vw;text-align:center}
footer .logo{--a:var(--milk);--b:#E9A1A4;font-size:2rem}
footer p{margin:.6rem auto 1.4rem;max-width:50ch;opacity:.8}
dialog{border:0;padding:0;background:var(--milk);width:min(1000px,96vw);max-height:94vh;max-height:94dvh;overflow:auto;margin:auto}
dialog::backdrop{background:rgba(36,22,21,.7);backdrop-filter:blur(3px)}
.x{position:sticky;top:0;float:right;z-index:5;background:var(--milk);border:1px solid var(--ink);width:42px;height:42px;font-size:20px;margin:12px}
.pv{display:grid;grid-template-columns:1.05fr 1fr;gap:32px;padding:28px}
.pv-img img{width:100%;aspect-ratio:1/1.15;object-fit:cover;background:var(--milk2)}
.seg{display:grid;grid-template-columns:1fr 1fr;margin-top:12px;border:1px solid var(--ink)}
.seg button{background:none;border:0;padding:12px;font-weight:600}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--milk)}
.pv-info{padding-top:28px}
.pv-info h2{font:700 clamp(1.8rem,3.4vw,2.6rem)/1.1 var(--serif)}
.price{color:var(--red);font:600 1.6rem var(--sans);margin:.7rem 0 1rem}
.desc{white-space:pre-line;margin-bottom:1.6rem;max-width:52ch}
.sz{margin:.4rem 0 1.4rem;font-size:14px}
form{padding:8px 28px 32px;max-width:640px;margin:auto}
form h2{font:700 2rem var(--serif);margin-bottom:.3rem}
.sum{display:flex;gap:14px;align-items:center;background:var(--milk2);padding:10px;margin:14px 0 20px}
.sum img{width:64px;height:74px;object-fit:cover}
.f{display:grid;gap:6px;margin-bottom:14px}
.f label,.lbl{font-size:14px;font-weight:600}
.f input,.f select,.f textarea{font:inherit;padding:13px 14px;border:1px solid var(--line);background:#FFFCF6;color:var(--ink);width:100%;border-radius:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.chip input{position:absolute;opacity:0}
.chip span{display:block;min-width:54px;text-align:center;padding:10px 14px;border:1px solid var(--ink);font-weight:600;cursor:pointer}
.chip input:checked+span{background:var(--red);border-color:var(--red);color:var(--milk)}
.chip input:focus-visible+span{outline:2px solid var(--red);outline-offset:2px}
.tot{display:flex;justify-content:space-between;font-weight:600;font-size:1.15rem;border-top:1px solid var(--ink);padding-top:14px;margin:6px 0 18px}
form .btn{width:100%}
.note{font-size:13px;opacity:.75;text-align:center;margin-top:12px}
.lnk{background:none;border:0;text-decoration:underline;padding:0;margin-bottom:10px}
.w{display:inline-block;overflow:hidden;padding:.1em .03em .16em;margin:-.1em -.03em -.16em;vertical-align:top}
.l{display:inline-block;transform:translateY(115%);transition:transform .4s cubic-bezier(.2,.8,.2,1),color .3s}
body.run .l{transform:none;animation:rise 1.1s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*60ms)}
@keyframes rise{from{transform:translateY(115%)}}
.hero .tag,.hero .btn{opacity:0;transform:translateY(14px)}
body.run .hero .tag,body.run .hero .btn{opacity:1;transform:none;transition:opacity .9s ease .45s,transform .9s cubic-bezier(.2,.8,.2,1) .45s}
.stage{clip-path:inset(0 0 100% 0)}
body.run .stage{clip-path:inset(0);transition:clip-path 1.1s cubic-bezier(.7,0,.2,1) .1s}
#intro{position:fixed;inset:0;z-index:100;background:var(--red);display:grid;place-items:center;transition:transform .8s cubic-bezier(.7,0,.2,1)}
#intro.go{transform:translateY(-101%)}
#intro .nm{font:700 clamp(2.4rem,9vw,5.5rem)/1.05 var(--serif);color:var(--milk);text-align:center;padding:0 5vw}
#intro .l{transform:none;animation:rise .7s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(.05s + var(--i)*35ms)}
#intro .ln{height:1px;background:var(--milk);width:0;margin:18px auto 0;animation:ln .9s .25s cubic-bezier(.7,0,.2,1) forwards}
@keyframes ln{to{width:min(240px,50vw)}}
.card .pic{clip-path:inset(100% 0 0 0)}
.card.in .pic{clip-path:inset(0);transition:clip-path 1s cubic-bezier(.7,0,.2,1) var(--dl,0s)}
.card h3,.card .m{opacity:0;transform:translateY(10px)}
.card.in h3,.card.in .m{opacity:1;transform:none;transition:opacity .7s ease calc(var(--dl,0s) + .5s),transform .7s ease calc(var(--dl,0s) + .5s)}
.pic img{transition:opacity .45s,transform 1.2s cubic-bezier(.2,.8,.2,1)}
.chip span{transition:background .2s,color .2s,transform .25s}
.chip input:checked+span{transform:scale(1.07)}
dialog[open]{animation:pop .5s cubic-bezier(.2,.8,.2,1)}
dialog[open]::backdrop{animation:fade .4s ease}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.97)}}
@keyframes fade{from{opacity:0}}
.fb{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px 24px;border-top:1px solid rgba(246,240,228,.2);margin-top:6vh;padding-top:22px;font-size:14px}
.fb a{color:var(--milk);font-weight:600;text-decoration:none;background:linear-gradient(var(--milk),var(--milk)) 0 100%/0 1px no-repeat;transition:background-size .4s;padding-bottom:2px}
.fb a:hover{background-size:100% 1px}
@media(max-width:760px){.fb{justify-content:center;text-align:center}}
.pager{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin-top:56px}
.pager button{min-width:44px;height:44px;padding:0 16px;background:none;border:1px solid var(--ink);font-weight:600;transition:background .25s,color .25s}
.pager button[aria-current=page]{background:var(--red);border-color:var(--red);color:var(--milk)}
.pager button:disabled{opacity:.35;cursor:default}
.pager button:not(:disabled):not([aria-current=page]):active{background:var(--ink);color:var(--milk)}
@media(hover:hover){.pager button:not(:disabled):not([aria-current=page]):hover{background:var(--ink);color:var(--milk)}}
@media(max-width:760px){dialog{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh}.hero{grid-template-columns:1fr}.pv{grid-template-columns:1fr;padding:16px}.pv-info{padding-top:0}.grid{grid-template-columns:1fr 1fr;gap:26px 12px}.perks{grid-template-columns:1fr}.perks div+div{border-left:0;border-top:1px solid var(--line)}.row{grid-template-columns:1fr}form{padding:8px 16px 28px}header a.wa{padding:7px 12px;font-size:13px}}
@media(prefers-reduced-motion:reduce){.bar-in,.sl img,.logo,body.run .l{animation:none!important}.l{transform:none}.stage,.card .pic{clip-path:none}.hero .tag,.hero .btn,.card h3,.card .m{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="intro"></div>
<div class="bar" aria-label="Announcement"><div class="bar-in" id="bar"></div></div>
<header><div class="logo" id="logo"></div><a class="wa" id="hwa" href="#">Chat on WhatsApp</a></header>
<section class="hero">
  <div><h1 id="hname"></h1><p class="tag" id="htag"></p><a class="btn" id="hbtn" href="#shop"></a></div>
  <button class="stage" id="flip" aria-label="Open this tee"><div id="slides"></div><div class="cap" id="cap"></div><div class="pg"><i id="pgi"></i></div></button>
</section>
<div class="perks" id="perks"></div>
<section class="shop" id="shop"><h2 id="st"></h2><p class="sub" id="ss"></p><div class="grid" id="grid"></div><nav class="pager" id="pager" aria-label="Pages"></nav></section>
<footer><div class="logo" id="flogo"></div><p id="ftag"></p><p id="fnote"></p><a class="btn line" id="fwa" href="#" style="color:var(--milk);border-color:var(--milk)">Chat on WhatsApp</a><div class="fb"><span id="copy"></span><span>Built with ♥ and passion by <a id="dev" href="#" target="_blank" rel="noopener"></a></span></div></footer>
<dialog id="dlg"><button class="x" id="x" aria-label="Close">×</button><div id="dbody"></div></dialog>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>CONFIG.CURRENCY+Number(n||0).toLocaleString('en-NG');
const ORDER=["XS","S","M","L","XL","XXL","2XL","3XL","4XL","5XL"];
const sortSizes=a=>[...new Set(a.map(s=>s.toUpperCase()))].sort((x,y)=>{const i=ORDER.indexOf(x),j=ORDER.indexOf(y);return (i<0?99:i)-(j<0?99:j)});
function img(u){u=(u||'').trim();const m=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?.*?id=)([\w-]+)/);return m?'https://lh3.googleusercontent.com/d/'+m[1]+'=w1000':u}
function tee(c,ink,t,back){const s=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 460'><rect width='400' height='460' fill='#EDE3D1'/><path d='M130 50 L58 88 L22 176 L84 196 L104 156 L104 424 L296 424 L296 156 L316 196 L378 176 L342 88 L270 50 Q200 ${back?70:100} 130 50Z' fill='${c}'/>${back?`<text x='200' y='250' font-size='56' text-anchor='middle' fill='${ink}' font-family='Georgia' font-weight='bold'>${t}</text>`:`<text x='200' y='205' font-size='24' text-anchor='middle' fill='${ink}' font-family='Georgia' font-style='italic'>${t}</text>`}</svg>`;return 'data:image/svg+xml;utf8,'+encodeURIComponent(s)}
const DEMO=[["Crown Heritage","#F6F0E4","#A3161C","Crown"],["Midnight Oath","#241615","#F6F0E4","Oath"],["Red Letter","#A3161C","#F6F0E4","Red"],["Quiet Money","#4A3F3D","#F6F0E4","Quiet"]].map((d,i)=>({id:i,name:d[0]+" Tee",price:18000+i*3500,front:tee(d[1],d[2],d[3],0),back:tee(d[1],d[2],d[3],1),desc:"Heavyweight cotton, relaxed premium fit.\nThis is a demo tee. Connect your Google Sheet to show your real designs.",sizes:CONFIG.SIZES,badge:i==0?"New":"",sold:false}));
let P=[],cur=null;
const IO=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');IO.unobserve(e.target)}}),{threshold:.12});
const swap=()=>$('#dbody').animate([{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],{duration:450,easing:'cubic-bezier(.2,.8,.2,1)'});
function split(t){let n=0;return t.split(' ').map(w=>`<span class="w">${[...w].map(c=>`<span class="l" aria-hidden="true" style="--i:${n++}">${esc(c)}</span>`).join('')}</span>`).join(' ')}
let SI=0,ST,PG=1;
function pager(n){const el=$('#pager');if(n<2){el.innerHTML='';return}
  const pgs=[...new Set([1,n,PG-1,PG,PG+1])].filter(x=>x>=1&&x<=n).sort((a,b)=>a-b);
  let h=`<button data-p="${PG-1}" ${PG<2?'disabled':''}>Previous</button>`,last=0;
  pgs.forEach(x=>{if(x-last>1)h+='<span aria-hidden="true">...</span>';h+=`<button data-p="${x}" ${x==PG?'aria-current="page"':''} aria-label="Page ${x}">${x}</button>`;last=x});
  h+=`<button data-p="${PG+1}" ${PG>=n?'disabled':''}>Next</button>`;el.innerHTML=h;
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{PG=+b.dataset.p;paint();$('#shop').scrollIntoView({behavior:'smooth'})})}
function slides(){clearInterval(ST);const L=[];P.slice(0,CONFIG.SLIDE_PRODUCTS||8).forEach(p=>{L.push({p,v:'Front view',s:p.front});if(p.back&&p.back!=p.front)L.push({p,v:'Back view',s:p.back})});
  $('#flip').style.display=L.length?'':'none';if(!L.length)return;
  $('#slides').innerHTML=L.map((x,k)=>`<div class="sl"><img ${k<2?'src':'data-s'}="${esc(x.s)}" alt="${esc(x.p.name)}, ${x.v}" decoding="async"></div>`).join('');
  const el=[...document.querySelectorAll('.sl')],cap=$('#cap'),pg=$('#pgi'),d=CONFIG.SLIDE_SECONDS;
  const show=i=>{SI=i;[i,(i+1)%el.length].forEach(k=>{const im=el[k].firstChild;if(!im.getAttribute('src'))im.src=im.dataset.s});el.forEach((e,k)=>e.classList.toggle('on',k==i));const x=L[i];cap.classList.add('sw');setTimeout(()=>{cap.innerHTML=`<div><b>${esc(x.p.name)}</b><span>${x.v}, ${money(x.p.price)}</span></div>`;cap.classList.remove('sw')},300);pg.classList.remove('run');void pg.offsetWidth;pg.style.setProperty('--d',d+'s');pg.classList.add('run')};
  show(0);ST=setInterval(()=>show((SI+1)%L.length),d*1000);$('#flip').onclick=()=>openP(L[SI].p.id)}
function run(){document.body.classList.add('run');slides()}

function parseCSV(t){const r=[];let row=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==','){row.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;row.push(c);r.push(row);row=[];c=''}else c+=ch}
if(c||row.length){row.push(c);r.push(row)}return r}
async function sheet(tab){const u=`https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tab)}`;const r=await fetch(u);if(!r.ok)throw 0;return parseCSV(await r.text())}
function objs(rows){const h=rows[0].map(x=>x.trim().toLowerCase());return rows.slice(1).filter(r=>r.some(x=>x.trim())).map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||'').trim()])))}

async function load(){
  if(!CONFIG.SHEET_ID){P=DEMO;return}
  try{const s=await sheet(CONFIG.SETTINGS_TAB);s.forEach(r=>{const k=(r[0]||'').trim().toLowerCase(),v=(r[1]||'').trim();if(!v)return;
    if(k=='brand'||k=='brand name')CONFIG.BRAND_NAME=v;else if(k=='tagline')CONFIG.TAGLINE=v;else if(k=='marquee')CONFIG.MARQUEE=v;else if(k=='whatsapp')CONFIG.WHATSAPP=v.replace(/\D/g,'')})}catch(e){}
  try{P=objs(await sheet(CONFIG.PRODUCTS_TAB)).filter(o=>o.name).map((o,i)=>({id:i,name:o.name,price:parseFloat((o.price||'0').replace(/[^\d.]/g,''))||0,front:img(o.front||o['front image']||o['front view']),back:img(o.back||o['back image']||o['back view']||o.front),desc:o.description||o.desc||'',sizes:o.sizes?o.sizes.split(/[,\s/|]+/).filter(Boolean):CONFIG.SIZES,badge:o.badge||'',sold:/^(yes|true|1|sold)/i.test(o.soldout||o['sold out']||'')}))
  ;try{localStorage.setItem('tee_cache',JSON.stringify({c:{BRAND_NAME:CONFIG.BRAND_NAME,TAGLINE:CONFIG.TAGLINE,MARQUEE:CONFIG.MARQUEE,WHATSAPP:CONFIG.WHATSAPP},P}))}catch(e){}}catch(e){if(!P.length)P=[]}
}

function paint(){
  const B=CONFIG.BRAND_NAME;document.title=B+" | "+CONFIG.TAGLINE;
  ['logo','flogo'].forEach(i=>$('#'+i).textContent=B);if($('#hname').dataset.b!==B){$('#hname').dataset.b=B;$('#hname').innerHTML=split(B);$('#hname').setAttribute('aria-label',B)}$('#copy').textContent=`© ${new Date().getFullYear()} ${B}. ${CONFIG.COPYRIGHT_TEXT}`;$('#dev').textContent=CONFIG.DEV_NAME;$('#dev').href=`https://wa.me/${CONFIG.DEV_WHATSAPP}?text=${encodeURIComponent(CONFIG.DEV_MESSAGE)}`;
  $('#htag').textContent=CONFIG.TAGLINE;$('#ftag').textContent=CONFIG.TAGLINE;$('#fnote').textContent=CONFIG.FOOTER_NOTE;
  $('#hbtn').textContent=CONFIG.HERO_BUTTON;$('#st').textContent=CONFIG.SHOP_TITLE;$('#ss').textContent=CONFIG.SHOP_SUBTITLE;
  const mq=CONFIG.MARQUEE;if($('#bar').dataset.m!==mq){$('#bar').dataset.m=mq;const m=`<span>${esc(mq)}</span>`,b=$('#bar');b.innerHTML=m+m;const w=Math.max(b.getBoundingClientRect().width/2,1),n=Math.max(1,Math.ceil(innerWidth*1.2/w));b.innerHTML=m.repeat(n*2);b.style.animationDuration=Math.max(14,n*w/55)+'s'}
  $('#perks').innerHTML=CONFIG.PERKS.map(p=>`<div>${esc(p)}</div>`).join('');
  const wa=`https://wa.me/${CONFIG.WHATSAPP}`;$('#hwa').href=wa;$('#fwa').href=wa;
  const per=CONFIG.PER_PAGE||12,pages=Math.max(1,Math.ceil(P.length/per));if(PG>pages)PG=pages;const list=P.slice((PG-1)*per,PG*per),gs=JSON.stringify(P)+window.LOADING+PG;if($('#grid').dataset.s!==gs){$('#grid').dataset.s=gs;$('#grid').innerHTML=list.length?list.map(p=>`<button class="card" data-i="${p.id}"><div class="pic">${p.sold?'<span class="badge sold">Sold out</span>':p.badge?`<span class="badge">${esc(p.badge)}</span>`:''}<img src="${esc(p.front)}" alt="${esc(p.name)} front" loading="lazy"><img src="${esc(p.back)}" alt="${esc(p.name)} back" loading="lazy"></div><h3>${esc(p.name)}</h3><div class="m"><b>${money(p.price)}</b><span>Front &amp; back</span></div></button>`).join(''):(window.LOADING?'<div class="empty">Loading the collection...</div>':'<div class="empty">No tees yet. Add rows to the Products tab of your sheet.</div>');
  document.querySelectorAll('.card').forEach((c,k)=>{c.onclick=()=>openP(+c.dataset.i);c.style.setProperty('--dl',(k%4)*.12+'s');IO.observe(c)})}pager(pages);
}

function openP(i){
  const p=P[i];cur=p;let v='front';
  $('#dbody').innerHTML=`<div class="pv"><div class="pv-img"><img id="pimg" src="${esc(p.front)}" alt="${esc(p.name)}"><div class="seg" role="group" aria-label="Choose view"><button data-v="front" aria-pressed="true">Front view</button><button data-v="back" aria-pressed="false">Back view</button></div></div>
  <div class="pv-info"><h2>${esc(p.name)}</h2><div class="price">${money(p.price)}</div><p class="desc">${esc(p.desc)}</p><p class="sz"><b>Sizes:</b> ${sortSizes(p.sizes).join(', ')}</p>${p.sold?'<button class="btn" disabled style="opacity:.5">Sold out</button>':'<button class="btn" id="go">Order this tee</button>'}</div></div>`;
  document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{v=b.dataset.v;$('#pimg').src=p[v];$('#pimg').animate([{opacity:0,transform:'scale(.96)'},{opacity:1,transform:'none'}],{duration:500,easing:'cubic-bezier(.2,.8,.2,1)'});document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x==b))});
  if($('#go'))$('#go').onclick=()=>orderForm(i);
  if($('#dlg').open)swap();else $('#dlg').showModal();$('#dlg').scrollTop=0;
}

function orderForm(i){
  const p=P[i],sz=sortSizes(p.sizes);
  $('#dbody').innerHTML=`<form id="of"><button type="button" class="lnk" id="bk">Back to ${esc(p.name)}</button><h2>Your order details</h2>
  <div class="sum"><img src="${esc(p.front)}" alt=""><div><b>${esc(p.name)}</b><br>${money(p.price)}</div></div>
  <div class="lbl">Choose your size</div><div class="chips">${sz.map(s=>`<label class="chip"><input type="radio" name="size" value="${s}" required><span>${s}</span></label>`).join('')}</div>
  <div class="row"><div class="f"><label for="q">Quantity</label><select id="q">${[1,2,3,4,5,6,8,10].map(n=>`<option>${n}</option>`).join('')}</select></div><div class="f"><label for="nm">Full name</label><input id="nm" required autocomplete="name"></div></div>
  <div class="row"><div class="f"><label for="ph">Phone number</label><input id="ph" type="tel" required autocomplete="tel"></div><div class="f"><label for="wn">WhatsApp number</label><input id="wn" type="tel" placeholder="Same as phone if empty"></div></div>
  <div class="f"><label for="em">Email (optional)</label><input id="em" type="email" autocomplete="email"></div>
  <div class="f"><label for="ad">Delivery address</label><textarea id="ad" rows="2" required autocomplete="street-address"></textarea></div>
  <div class="row"><div class="f"><label for="ct">City</label><input id="ct" required></div><div class="f"><label for="stt">State</label><input id="stt" required></div></div>
  <div class="f"><label for="nt">Anything we should know? (optional)</label><input id="nt"></div>
  <div class="tot"><span>Total</span><span id="tt">${money(p.price)}</span></div>
  <button class="btn" type="submit">Send my order on WhatsApp</button><p class="note">You will be taken to WhatsApp with your order already written. Payment is arranged there.</p></form>`;
  $('#bk').onclick=()=>openP(i);swap();
  $('#q').onchange=()=>$('#tt').textContent=money(p.price*$('#q').value);
  $('#of').onsubmit=e=>{e.preventDefault();const g=id=>$('#'+id).value.trim(),q=+$('#q').value,size=document.querySelector('input[name=size]:checked').value;
    const msg=`Hello ${CONFIG.BRAND_NAME}, I would like to place an order.\n\n*ORDER*\nTee: ${p.name}\nSize: ${size}\nQuantity: ${q}\nPrice: ${money(p.price)} each\nTotal: ${money(p.price*q)}\n\n*MY DETAILS*\nName: ${g('nm')}\nPhone: ${g('ph')}\nWhatsApp: ${g('wn')||g('ph')}\nEmail: ${g('em')||'-'}\nAddress: ${g('ad')}\nCity: ${g('ct')}\nState: ${g('stt')}\n${g('nt')?'Note: '+g('nt')+'\n':''}\nPlease send me the payment details.`;
    const b=$('#of .btn');b.disabled=true;b.textContent='Opening WhatsApp...';const u=`https://wa.me/${CONFIG.WHATSAPP}?text=${encodeURIComponent(msg)}`;setTimeout(()=>location.href=u,700);setTimeout(()=>{b.disabled=false;b.textContent='Send my order on WhatsApp'},4500)};
  $('#dlg').scrollTop=0;
}
$('#x').onclick=()=>$('#dlg').close();
$('#dlg').addEventListener('click',e=>{if(e.target==$('#dlg'))$('#dlg').close()});
(()=>{let first=true,ready=false,lifted=false;const t0=Date.now(),it=$('#intro');
try{first=!sessionStorage.getItem('seen');sessionStorage.setItem('seen',1)}catch(e){}
if(matchMedia('(prefers-reduced-motion:reduce)').matches)first=false;
if(!CONFIG.SHEET_ID){P=DEMO;ready=true}else{try{const c=JSON.parse(localStorage.getItem('tee_cache')||'null');if(c&&c.P&&c.P.length){Object.assign(CONFIG,c.c);P=c.P;ready=true}}catch(e){}}
window.LOADING=!ready;paint();
const sig=JSON.stringify(P);
const lift=()=>{if(lifted)return;lifted=true;it.classList.add('go');run();setTimeout(()=>it.remove(),900)};
const tick=()=>{const e=Date.now()-t0;if(e>=1200&&(ready||e>=3000))lift();else setTimeout(tick,80)};
if(first){it.innerHTML=`<div><div class="nm">${split(CONFIG.BRAND_NAME)}</div><div class="ln"></div></div>`;tick()}else{it.remove();run()}
load().then(()=>{ready=true;window.LOADING=false;paint();if(document.body.classList.contains('run')&&JSON.stringify(P)!==sig)slides()})})();
</script>
</body>
</html>
